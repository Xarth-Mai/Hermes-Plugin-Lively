[project]
name = "hermes-plugin-lively"
version = "0.2.1"
description = "Proactive contact and folder-based stickers for Hermes"
requires-python = ">=3.11"
license = "MPL-2.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
